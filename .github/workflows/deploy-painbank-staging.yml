name: Deploy Pain Bank Staging

on:
  push:
    branches: [staging]
    paths:
      - 'apps/painbank/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-painbank-staging.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PAINBANK_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @sanzhar/painbank test

      - name: Pull Vercel project settings
        working-directory: apps/painbank
        run: npx vercel@latest pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        working-directory: apps/painbank
        run: npx vercel@latest build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        working-directory: apps/painbank
        run: npx vercel@latest deploy --prebuilt --yes --token=${{ secrets.VERCEL_TOKEN }}
